name: CI

# A change to notes only (docs/, *.md) runs nothing: nothing in it reaches the app.
on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/screenshots/
          retention-days: 14

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Same Postgres build that Supabase runs, including the auth schema and pgTAP.
        image: supabase/postgres:17.11.0.004
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Migrations and RLS tests
        run: bash scripts/db-test.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  e2e-auth:
    # Sign-up, onboarding and settings against a local Supabase (synthetic users only).
    # Split over three machines that run at the same time, each with its own Supabase.
    name: e2e-auth (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Start Supabase (database, auth, API, storage and the Mailpit inbox for e-mailed codes)
        run: supabase start -x realtime,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Point the app at local Supabase
        # Local development keys, not secrets; they only work against this throwaway instance.
        run: |
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/auth.spec.ts e2e/team.spec.ts e2e/vehicles.spec.ts e2e/customers.spec.ts e2e/password.spec.ts e2e/confirm.spec.ts e2e/jobs.spec.ts e2e/calendar.spec.ts e2e/driver.spec.ts e2e/job-time.spec.ts e2e/job-files.spec.ts e2e/invoice.spec.ts e2e/invoices.spec.ts e2e/accountant.spec.ts e2e/permissions.spec.ts e2e/invoice-settings.spec.ts e2e/invoice-issue.spec.ts e2e/hours.spec.ts e2e/billing.spec.ts e2e/company-page.spec.ts e2e/company-photos.spec.ts e2e/job-requests.spec.ts e2e/free-times.spec.ts --shard=${{ matrix.shard }}/3
        env:
          CI: true
      - name: Show what the page looked like when a test failed
        if: failure()
        run: find test-results -name error-context.md -print -exec cat {} \; || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-auth-${{ matrix.shard }}
          path: test-results/screenshots/
          retention-days: 14
